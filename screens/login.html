<body class="flex min-h-screen items-center justify-center p-gutter relative overflow-hidden">
<!-- Background Decorative Elements -->

<div class="mb-lg">
<span class="text-display-xl font-display-xl text-primary italic tracking-widest leading-none">EXPERT CLUB</span>
</div>
<h1 class="font-h2 text-h2 text-on-background text-center">Bem-vindo ao Expert Club</h1>
<p class="font-body-md text-body-md text-on-surface-variant/60 mt-xs text-center">Treino, dieta e rotina para evoluir todos os meses sem achismo.</p>
</div>
<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:24px;">
<span style="background:rgba(183,255,60,0.08);border:1px solid rgba(183,255,60,0.18);color:#B7FF3C;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;font-family:Inter,sans-serif;">Treinos mensais</span>
<span style="background:rgba(93,220,255,0.08);border:1px solid rgba(93,220,255,0.18);color:#5DDCFF;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;font-family:Inter,sans-serif;">Dietas por objetivo</span>
<span style="background:rgba(139,92,246,0.08);border:1px solid rgba(139,92,246,0.18);color:#8B5CF6;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;font-family:Inter,sans-serif;">Comunidade ativa</span>
</div>
<!-- Login Card -->
<div class="glass-panel p-lg rounded-xl shadow-2xl">
<form action="#" class="space-y-lg">
<!-- Email Field -->
<div class="space-y-sm">
<label class="font-ui-label text-ui-label text-on-surface-variant uppercase tracking-wider" for="email">Endereço de e-mail</label>
<div class="input-inset flex items-center px-md py-md rounded-lg">
<span class="material-symbols-outlined text-on-surface-variant/40 mr-sm" data-icon="mail">mail</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface font-body-md placeholder:text-white/20" id="email" placeholder="nome@exemplo.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="font-ui-label text-ui-label text-on-surface-variant uppercase tracking-wider" for="password">Sua senha</label>
<a class="font-ui-label text-ui-label text-[#5DDCFF] hover:underline transition-all" href="#">Esqueci minha senha</a>
</div>
<div class="input-inset flex items-center px-md py-md rounded-lg">
<span class="material-symbols-outlined text-on-surface-variant/40 mr-sm" data-icon="lock">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-surface font-body-md placeholder:text-white/20" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-[#07080A] py-md px-lg rounded-lg font-ui-label text-body-lg font-bold hover:opacity-90 active:scale-95 transition-all flex justify-center items-center gap-sm" type="submit">
                    Entrar
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-xl pt-lg border-t border-white/5 flex flex-col items-center gap-md">
<p class="font-body-md text-on-surface-variant/60">Ainda não faz parte do clube?</p>
<a class="w-full border border-white/10 text-on-surface py-md px-lg rounded-lg font-ui-label text-body-md font-medium hover:bg-white/5 transition-all text-center" href="signup.html">
